<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <link rel="stylesheet" href="login_style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="container">
    <div class="form-box">
    <h1 class="title">Sign Up</h1>
    <div class="underline"></div>
    <form>
        <div class="input-group">
            <div class="input-field namefield">
            <i class="fa-solid fa-user"></i>
            <input type="text" placeholder="Name">
            </div> <!-- end input field -->

            <div class="input-field">
            <i class="fa-solid fa-at"></i>
            <input type="email" placeholder="Email">
            </div> <!-- end input field -->

            <div class="input-field">
            <i class="fa-solid fa-key"></i>
            <input type="password" placeholder="Password">
            </div> <!-- end input field -->
            <p><span class="text">Password Suggestions</span>
            <a href="#"> Click Here!</a></p>
        </div> <!-- end input group-->

        <div class="btn-field">
            <button type="button" class="signupbtn">Sign up</button>
            <button type="button" class="disable
             signinbtn">Sign in</button>
        </div> <!-- end btn field -->
    </form>
    </div> <!-- end form box -->
    </div> <!-- end container -->
    
    <script src="login_script.js"></script>

      <!-- language traslator script  -->
      <script>
        function googleTranslateElementInit() {
          new google.translate.TranslateElement(
            {
              pageLanguage: 'en',
              includedLanguages: 'en,hi,es,fr,de,zh,ar',
              layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            },
            'google_translate_element'
          );
        }
      
        // Show Google Translate when button is clicked
        window.addEventListener("DOMContentLoaded", () => {
          const translateBtn = document.getElementById("translateBtn");
          const translateEl = document.getElementById("google_translate_element");
      
          if (translateBtn) {
            translateBtn.addEventListener("click", () => {
              translateEl.style.display =
                translateEl.style.display === "none" ? "block" : "none";
            });
          }
        });
      </script>
      
      <!-- Google Translate Library -->
      <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
      
</body>
</html>
