<script>
 
  window.addEventListener("DOMContentLoaded", () => {
    let mlDetectionResult = null;

    const fileInput = document.getElementById("imageUpload");

    fileInput.addEventListener("change", async function (event) {
      const file = event.target.files[0];

      if (!file) {
        alert("Please upload a valid image file.");
        return;
      }

      // Show preview
      const reader = new FileReader();
      reader.onload = function (e) {
        document.getElementById("imagePreview").innerHTML = `
          <img src="${e.target.result}" alt="Uploaded Image" style="max-width:100%; max-height:200px;">
        `;
      };
      reader.readAsDataURL(file);

      // Send file to backend
      const formData = new FormData();
      formData.append("image", file);

      try {
        const response = await fetch("http://127.0.0.1:5000/detect", {
          method: "POST",
          body: formData,
        });
        const data = await response.json();

        if (data.error) {
          alert("Error: " + data.error);
          mlDetectionResult = null;
          return;
        }

        // console.log("Detection Result:", data);
        mlDetectionResult = data?.detections[0] || null;

        if (data.annotated_image) {
          // Add cache-busting query param
          document.getElementById("imagePreview").innerHTML = `
            <img src="${data.annotated_image}?t=${Date.now()}" alt="Detected Image" style="max-width:100%; max-height:200px;">
          `;
        }
      } catch (error) {
        console.error("Detection Error:", error);
        alert("Something went wrong during detection.");
      }

      // Reset input so the same image can be uploaded again
      fileInput.value = ""; // Reset the file input value
    });

    document.getElementById("detectPest").addEventListener("click", () => {
      if (!mlDetectionResult) {
        alert("No detection result available. Please upload and detect an image first.");
        return;
      }

      document.getElementById("pestName").textContent = mlDetectionResult.class || "--";
      document.getElementById("pestSeverity").textContent =
        mlDetectionResult.confidence > 0.7 ? "High" : "Low";
      document.getElementById("pestSolution").textContent = mlDetectionResult.treatment || "--";
    });
  });

</script>
